name: BATS Tests

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, 0.1.0-rc.1]

jobs:
  bats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq >= 1.8
        run: |
          curl -L https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq
          jq --version

      - name: Run BATS tests
        run: ./test/run-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-results
          path: test-results/
          retention-days: 30
